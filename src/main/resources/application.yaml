
logging:
  level:
    org:
      hibernate:
        SQL: warn

  # El registro va a un FICHERO, y no es una comodidad: ActiHome se reparte como
  # un .exe generado con jpackage SIN CONSOLA, así que todo lo que se escriba por
  # la salida estándar no lo lee nadie, nunca. Sin esto, cuando a un usuario le
  # falla algo no hay absolutamente nada que poder pedirle.
  #
  # Va junto a la base de datos, en ~/.actihome/, que es el único sitio donde
  # esta aplicación escribe en tiempo de ejecución. Dentro del jar no puede ir:
  # ya está construido y es de solo lectura.
  file:
    name: ${user.home}/.actihome/logs/actihome.log

    # Con rotación, porque un registro sin límite acaba siendo un fichero de
    # gigabytes en el disco de otra persona. Siete archivos de 5 MB es de sobra
    # para diagnosticar algo que pasó hace unos días, que es el caso real.
    max-size: 5MB
    max-history: 7

spring:
  main:
    headless: false

  # ---------------------------------------------------------------------------
  # Base de datos por defecto: H2 embebida, en fichero.
  #
  # H2 está escrita en Java puro y viaja dentro del jar, así que la aplicación se
  # abre sin instalar ni configurar nada. Los datos se guardan en la carpeta del
  # usuario y persisten entre arranques.
  #
  # Antes hacía falta un servidor MySQL con una base y unas credenciales
  # concretas. Eso convertía la aplicación en algo que solo funcionaba en el
  # ordenador donde se había montado: ni se podía compartir, ni los tests corrían
  # en una máquina limpia.
  #
  # MySQL sigue disponible con el perfil "mysql":
  #     mvnw spring-boot:run "-Dspring-boot.run.profiles=mysql"
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:file:${user.home}/.actihome/actihome;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: actihome
    password: ""
    driverClassName: org.h2.Driver

    # Los scripts se declaran explícitamente en vez de dejar que Spring los
    # descubra por convención: así queda a la vista cuál se ejecuta y cuándo.
    #
    # El segundo, migracion-h2.sql, pone al día las bases de datos que ya existían
    # antes de que se añadieran columnas nuevas. Va aparte porque usa sintaxis que
    # MySQL no entiende; el detalle está explicado dentro del propio archivo.
    schema:
      - classpath:schema.sql
      - classpath:migracion-h2.sql
    data:
      - classpath:data.sql
      # Precarga de la cache de traducciones (Fase 8.7), generada por
      # ui/dev/SembrarTraducciones. Va DESPUES de data.sql porque no depende de
      # ninguna fila suya: traduce textos, no campos de entidades.
      - classpath:traducciones.sql
    initialization-mode: always

    # Los scripts SQL se leen como UTF-8 SIEMPRE, y no con la codificación por
    # defecto de la máquina.
    #
    # Sin esta línea, Spring lee schema.sql y data.sql con el juego de caracteres
    # del sistema, que en Windows en español es Windows-1252. El resultado es que
    # "Loft Barrio Gótico" se siembra como "Loft Barrio GÃ³tico": cada carácter
    # acentuado, que en UTF-8 ocupa dos bytes, se interpreta como dos caracteres.
    #
    # Y es un fallo especialmente traicionero porque **depende de cómo arranques**:
    # con el ejecutable de jpackage no pasaba, porque ese lanzador fija
    # -Dfile.encoding=UTF-8. Solo apareció al ejecutar la herramienta de capturas
    # con Maven. Un dato corrompido según quién abra la aplicación es peor que uno
    # corrompido siempre, porque no se reproduce.
    sql-script-encoding: UTF-8

  jackson:
    default-property-inclusion: NON_NULL

  jpa:
    hibernate:
      # "validate" comprueba al arrancar que las entidades y las tablas cuadran, y
      # falla si no. Es la red que avisa cuando alguien cambia una entidad y se
      # olvida del esquema, que es un fallo que si no aparece tarde y en forma de
      # error incomprensible.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# -----------------------------------------------------------------------------
# Envío de correo para el código de recuperación de contraseña (Fase 8.6)
#
# Los cinco valores salen de VARIABLES DE ENTORNO y por defecto están vacíos.
# Vacíos significa "esta instalación no envía correo", y la aplicación usa
# entonces el otro camino: un administrador genera el código y lo entrega.
#
# No es solo una buena práctica genérica de no meter secretos en el repositorio.
# ActiHome se reparte como un .exe, es decir, como un fichero en el disco de otra
# persona: cualquier credencial que viajara dentro se puede extraer
# descompilándolo, y quien la extrajera podría enviar correo haciéndose pasar por
# el dueño de la cuenta hasta que el proveedor la cerrara. Fuera del ejecutable,
# el ejecutable repartido no lleva nada que robar.
#
# Para activarlo en tu máquina, con una cuenta gratuita de Brevo:
#
#     $env:ACTIHOME_MAIL_HOST     = "smtp-relay.brevo.com"
#     $env:ACTIHOME_MAIL_PORT     = "587"
#     $env:ACTIHOME_MAIL_USER     = "el usuario SMTP que da Brevo"
#     $env:ACTIHOME_MAIL_PASSWORD = "la clave SMTP de Brevo"
#     $env:ACTIHOME_MAIL_FROM     = "tu-remitente-verificado@dominio"
# -----------------------------------------------------------------------------
actihome:
  mail:
    host: ${ACTIHOME_MAIL_HOST:}
    port: ${ACTIHOME_MAIL_PORT:587}
    user: ${ACTIHOME_MAIL_USER:}
    password: ${ACTIHOME_MAIL_PASSWORD:}
    from: ${ACTIHOME_MAIL_FROM:}
