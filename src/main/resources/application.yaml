
logging:
  level:
    org:
      hibernate:
        SQL: warn

spring:
  main:
    headless: false

  # ---------------------------------------------------------------------------
  # Base de datos por defecto: H2 embebida, en fichero.
  #
  # H2 está escrita en Java puro y viaja dentro del jar, así que la aplicación se
  # abre sin instalar ni configurar nada. Los datos se guardan en la carpeta del
  # usuario y persisten entre arranques.
  #
  # Antes hacía falta un servidor MySQL con una base y unas credenciales
  # concretas. Eso convertía la aplicación en algo que solo funcionaba en el
  # ordenador donde se había montado: ni se podía compartir, ni los tests corrían
  # en una máquina limpia.
  #
  # MySQL sigue disponible con el perfil "mysql":
  #     mvnw spring-boot:run "-Dspring-boot.run.profiles=mysql"
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:file:${user.home}/.actihome/actihome;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: actihome
    password: ""
    driverClassName: org.h2.Driver

    # Los scripts se declaran explícitamente en vez de dejar que Spring los
    # descubra por convención: así queda a la vista cuál se ejecuta y cuándo.
    #
    # El segundo, migracion-h2.sql, pone al día las bases de datos que ya existían
    # antes de que se añadieran columnas nuevas. Va aparte porque usa sintaxis que
    # MySQL no entiende; el detalle está explicado dentro del propio archivo.
    schema:
      - classpath:schema.sql
      - classpath:migracion-h2.sql
    data: classpath:data.sql
    initialization-mode: always

    # Los scripts SQL se leen como UTF-8 SIEMPRE, y no con la codificación por
    # defecto de la máquina.
    #
    # Sin esta línea, Spring lee schema.sql y data.sql con el juego de caracteres
    # del sistema, que en Windows en español es Windows-1252. El resultado es que
    # "Loft Barrio Gótico" se siembra como "Loft Barrio GÃ³tico": cada carácter
    # acentuado, que en UTF-8 ocupa dos bytes, se interpreta como dos caracteres.
    #
    # Y es un fallo especialmente traicionero porque **depende de cómo arranques**:
    # con el ejecutable de jpackage no pasaba, porque ese lanzador fija
    # -Dfile.encoding=UTF-8. Solo apareció al ejecutar la herramienta de capturas
    # con Maven. Un dato corrompido según quién abra la aplicación es peor que uno
    # corrompido siempre, porque no se reproduce.
    sql-script-encoding: UTF-8

  jackson:
    default-property-inclusion: NON_NULL

  jpa:
    hibernate:
      # "validate" comprueba al arrancar que las entidades y las tablas cuadran, y
      # falla si no. Es la red que avisa cuando alguien cambia una entidad y se
      # olvida del esquema, que es un fallo que si no aparece tarde y en forma de
      # error incomprensible.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
