# Perfil de tests: H2 en memoria.
#
# Cada ejecución arranca con una base recién creada que desaparece al terminar,
# así que los tests no dependen de nada instalado ni se estorban entre
# ejecuciones. Antes atacaban la misma base real que la aplicación y solo
# quedaban limpios porque cada clase de test hace rollback: bastaba con que un
# test olvidara @Transactional para ensuciar los datos de trabajo.
#
# Este perfil desactiva además los beans de interfaz (@Profile("!test")), para
# que levantar el contexto de test no construya ventanas de Swing.

# El registro a fichero se desactiva en este perfil, y eso vive en
# logback-spring.xml (<springProfile name="!test">). Sin ello, cualquiera que
# ejecute los tests dejaría rastro en su carpeta personal, mezclado con el
# registro de la aplicación de verdad.

spring:
  datasource:
    url: jdbc:h2:mem:actihome-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway hereda la configuración de application.yaml y se ejecuta también aquí:
  # cada clase de test arranca contra una base vacía, así que corre V1 y siembra
  # los datos de ejemplo. Es a propósito y no un descuido — varios tests dependen
  # de que existan los diez alojamientos y los usuarios de data.sql, y esa
  # dependencia estaba ahí antes de Flyway.
