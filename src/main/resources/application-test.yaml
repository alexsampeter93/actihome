# Perfil de tests: H2 en memoria.
#
# Cada ejecución arranca con una base recién creada que desaparece al terminar,
# así que los tests no dependen de nada instalado ni se estorban entre
# ejecuciones. Antes atacaban la misma base real que la aplicación y solo
# quedaban limpios porque cada clase de test hace rollback: bastaba con que un
# test olvidara @Transactional para ensuciar los datos de trabajo.
#
# Este perfil desactiva además los beans de interfaz (@Profile("!test")), para
# que levantar el contexto de test no construya ventanas de Swing.

# El registro se desvía a target/, que es desechable y ya está en el .gitignore.
# Sin esto los tests heredarían la ruta de application.yaml y escribirían en
# ~/.actihome/logs/, o sea en la carpeta personal de quien los ejecute: mezclado
# con el registro de la aplicación de verdad y sin que nadie lo haya pedido.
# Un test no debe dejar rastro fuera del directorio de construcción.
logging:
  file:
    name: target/test-logs/actihome-test.log

spring:
  datasource:
    url: jdbc:h2:mem:actihome-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driverClassName: org.h2.Driver
    schema: classpath:schema.sql
    data:
      - classpath:data.sql
      # Precarga de la cache de traducciones (Fase 8.7), generada por
      # ui/dev/SembrarTraducciones. Va DESPUES de data.sql porque no depende de
      # ninguna fila suya: traduce textos, no campos de entidades.
      - classpath:traducciones.sql
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
